    <!-- Every load or refresh starts at the top: no restored scroll position, no jump to a #hash -->
    <script>try{history.scrollRestoration="manual";if(location.hash)history.replaceState(null,"",location.pathname+location.search);scrollTo(0,0);addEventListener("pageshow",function(){scrollTo(0,0)})}catch(e){}</script>
    <!-- theme · quality tier for src/lib/perf.ts (?perf=high|mid|low forces one) · motion only where supported and not reduced -->
    <script>try{var d=document.documentElement,q=location.search,T=["low","mid","high"],n=navigator,c=n.connection||{},m=n.deviceMemory||8,h=n.hardwareConcurrency||8,p=c.saveData||m<=2||h<=2?0:matchMedia("(pointer: coarse)").matches||m<=4||h<=4?1:2,o=/[?&]perf=(low|mid|high)/.exec(q);try{var s=JSON.parse(localStorage.getItem("perfTier"));if(s&&Date.now()-s.t<6048e5&&T.indexOf(s.tier)>=0)p=Math.min(p,T.indexOf(s.tier))}catch(e){}d.dataset.perf=o?o[1]:T[p];if(window.CSS&&CSS.supports("color","color-mix(in srgb,red,red)")&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&!/[?&]reduced/.test(q)){d.classList.add("motion");d.classList.add("is-intro")}}catch(e){}</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
